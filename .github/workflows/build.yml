name: build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_ID: codex-quota-warmup

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("registry.json"))["plugins"][0]["version"])')"
          test -n "$version"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p package dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared -trimpath \
            -ldflags="-s -w -X main.pluginVersion=${VERSION}" \
            -o "package/${PLUGIN_ID}.so" .
          rm -f "package/${PLUGIN_ID}.h"
          (cd package && zip -q "../dist/${PLUGIN_ID}_${VERSION}_linux_amd64.zip" "${PLUGIN_ID}.so")

      - uses: actions/upload-artifact@v4
        with:
          name: codex-quota-warmup_linux_amd64
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("registry.json"))["plugins"][0]["version"])')"
          tag="v${version#v}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME does not match registry version $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum codex-quota-warmup_*.zip | sort -k2 > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
